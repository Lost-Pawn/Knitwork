services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: knitwork
      POSTGRES_USER: knitwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-knitwork-only}
    volumes:
      - knitwork-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U knitwork -d knitwork]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - '127.0.0.1:${DB_PORT:-5434}:5432'
  app:
    build: .
    environment:
      DATABASE_URL: postgres://knitwork:${POSTGRES_PASSWORD:-local-knitwork-only}@db:5432/knitwork?sslmode=disable
      APP_ENV: development
      APP_ORIGIN: http://localhost:${APP_PORT:-8080}
      DEMO_SEED: 'true'
      PORT: '8080'
      HELP_API_BASE_URL: ${HELP_API_BASE_URL:-}
      HELP_API_KEY: ${HELP_API_KEY:-}
      HELP_MODEL: ${HELP_MODEL:-}
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/api/health]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  knitwork-data:
