services:
  - type: web
    name: knitwork
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: knitwork-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEMO_SEED
        value: 'false'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HELP_API_BASE_URL
        sync: false
      - key: HELP_API_KEY
        sync: false
      - key: HELP_MODEL
        sync: false
databases:
  - name: knitwork-db
    plan: 0.1c-256mb
    databaseName: knitwork
    user: knitwork
    diskSizeGB: 5
    ipAllowList: []
    postgresMajorVersion: '17'
